services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verdict
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verdict}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict -d verdict"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    ports:
      - "${VERDICT_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://verdict:${POSTGRES_PASSWORD:-verdict}@db:5432/verdict
      DEMO_MODE: ${DEMO_MODE:-1}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30
    restart: unless-stopped
volumes:
  pgdata:
  appdata:
