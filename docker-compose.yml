services:
  db:
    image: postgres:16-alpine
    pull_policy: missing
    environment:
      POSTGRES_DB: verdict
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verdict}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict -d verdict"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    # network: none proves the image builds offline (packages come from vendor/wheels).
    build:
      context: .
      network: none
    image: verdict-local
    pull_policy: build
    ports:
      - "${VERDICT_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://verdict:${POSTGRES_PASSWORD:-verdict}@db:5432/verdict
      DEMO_MODE: ${DEMO_MODE:-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@verdict.local}
      WEBHOOKS_ALLOW_PRIVATE: ${WEBHOOKS_ALLOW_PRIVATE:-0}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30
    restart: unless-stopped
  webhook-worker:
    build:
      context: .
      network: none
    image: verdict-local
    pull_policy: build
    command: ["python", "manage.py", "deliver_webhooks", "--workers", "2"]
    environment:
      DATABASE_URL: postgres://verdict:${POSTGRES_PASSWORD:-verdict}@db:5432/verdict
      DEMO_MODE: ${DEMO_MODE:-1}
      SECRET_KEY: ${SECRET_KEY:-}
      WEBHOOKS_ALLOW_PRIVATE: ${WEBHOOKS_ALLOW_PRIVATE:-0}
    volumes:
      - appdata:/data
    depends_on:
      web:
        condition: service_healthy
    # The web image's HTTP probe is not applicable to a queue consumer.
    healthcheck:
      disable: true
    stop_grace_period: 40s
    restart: unless-stopped
volumes:
  pgdata:
  appdata:
