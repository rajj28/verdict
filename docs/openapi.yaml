    IntegrityProbe:
      type: object
      description: One attack the portal refused, and the rule that refused it.
      properties:
        key:
          type: string
          description: Stable name of this attack case.
        area:
          type: string
          description: JUDGING, SUBMISSIONS, PROJECTS, MEDIA, EVENT ISOLATION, EXPORTS,
            AUTH, VOTING, CERTIFICATES, SIGNED RECORDS or WEBHOOKS.
        description:
          type: string
        method:
          type: string
        path:
          type: string
          description: The URL attacked. Disposable invite capabilities are shown
            as [temporary] so the report carries no live token.
        actor:
          type: string
          description: Who made the request, as the probe drove it.
        expected:
          type: string
          description: The status codes that would mean 'refused'.
        actual:
          type: string
        status_code:
          type: integer
        passed:
          type: boolean
          description: True when the response was the expected refusal, or when the
            leak the case was checking for was absent.
        reason:
          type: string
          description: The rule this case defends, or why it failed.
      required:
      - actor
      - actual
      - area
      - description
      - expected
      - key
      - method
      - passed
      - path
      - reason
      - status_code
    IntegrityProbeReport:
      type: object
      description: The report. Every fixture row the probe created is rolled back
        before it returns.
      properties:
        ok:
          type: boolean
          description: True only when every case was refused.
        passed:
          type: integer
        total:
          type: integer
        summary:
          type: string
          description: For example '31/31 attacks refused'.
        event:
          type: string
          description: Scoped event slug, if any.
        extensions:
          type: array
          items:
            type: string
          description: 'Registry extension areas the probe exercises: voting and publication.'
        cases:
          type: array
          items:
            $ref: '#/components/schemas/IntegrityProbe'
      required:
      - cases
      - event
      - extensions
      - ok
      - passed
      - summary
      - total
