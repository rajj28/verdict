            $ref: '#/components/schemas/RebalanceMove'
        skipped:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - max_load
      - moves
      - skipped
    RebalanceResponse:
      type: object
      properties:
        dry_run:
          type: boolean
        moved:
          type: integer
        batch_created:
          type: boolean
        max_load:
          type: integer
        moves:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceMove'
        skipped:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - batch_created
      - dry_run
      - max_load
      - moved
      - moves
      - skipped
    RebalanceWrite:
      type: object
      properties:
        dry_run:
          type: boolean
          default: true
        max_load:
          type: integer
          minimum: 1
    RecordVerification:
      type: object
      properties:
        valid:
          type: boolean
        reason:
          type: string
          description: Why it failed, or 'Signature is valid.' This checks the signature
            against the published key, not who issued the record.
      required:
      - reason
      - valid
    Register:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 256
        display_name:
          type: string
          maxLength: 80
        next:
          type: string
          maxLength: 2000
      required:
      - email
      - password
    ReplayVerdict:
      type: object
      properties:
        verdict:
          type: string
        matches:
          type: boolean
        detail:
          type: string
      required:
      - detail
      - matches
      - verdict
    ResetLink:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserBrief'
        reset_url:
          type: string
          description: Relative single-use link to hand to the user.
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - reset_url
      - user
    ResetPassword:
      type: object
      properties:
        password:
          type: string
          maxLength: 256
        token:
          type: string
          maxLength: 200
      required:
      - password
      - token
    ResetPasswordResponse:
      type: object
      properties:
        ok:
          type: boolean
        user:
          $ref: '#/components/schemas/UserBrief'
        redirect_to:
          type: string
      required:
      - ok
      - redirect_to
      - user
    ResultRow:
      type: object
      description: One ranked project. Judge identities are not part of this shape.
      properties:
        project_id:
          type: string
        title:
          type: string
        team:
          type: string
        track:
          type: string
          nullable: true
        n_reviews:
          type: integer
          description: Reviews actually included.
        raw_mean:
          type: number
          format: double
          nullable: true
          description: Unadjusted mean score.
        normalized:
          type: number
          format: double
          nullable: true
          description: Judge-offset adjusted score; null under 'raw'.
        rank:
          type: string
          nullable: true
          description: Official rank for this event's ranking method.
        rank_raw:
          type: integer
          nullable: true
        rank_norm:
          type: integer
          nullable: true
        rank_bt:
          type: integer
          nullable: true
        live_strength:
          type: number
          format: double
          nullable: true
          description: Live pairwise strength, when in use.
        rank_live:
          type: integer
          nullable: true
        rank_low:
          type: integer
          nullable: true
        rank_high:
          type: integer
          nullable: true
        score_low:
          type: number
          format: double
          nullable: true
        score_high:
          type: number
          format: double
          nullable: true
        p_first:
          type: number
          format: double
          nullable: true
        p_top:
          type: number
          format: double
          nullable: true
        p_above_next:
          type: number
          format: double
          nullable: true
        tied_with_next:
          type: boolean
        tied_with_previous:
          type: boolean
        n_comparisons:
          type: integer
        status:
          type: string
          description: '''ranked'', ''draft'', ''withdrawn'', ''disqualified'', ''superseded'',
            or an ''unranked_*'' reason.'
        status_reason:
          type: string
          nullable: true
      required:
      - live_strength
      - n_comparisons
      - n_reviews
      - normalized
      - p_above_next
      - p_first
      - p_top
      - project_id
      - rank
      - rank_bt
      - rank_high
      - rank_live
      - rank_low
      - rank_norm
      - rank_raw
      - raw_mean
      - score_high
      - score_low
      - status
      - status_reason
      - team
      - tied_with_next
      - tied_with_previous
      - title
      - track
    ResultsPreview:
      type: object
      description: The engine output an organizer sees before publishing. Nothing
        is stored.
      properties:
        method:
          type: string
          description: '''raw'', ''normalized'' or ''pairwise''.'
        lam:
          type: number
          format: double
          nullable: true
          description: Shrinkage penalty actually used.
        lambda_choice:
          type: object
          additionalProperties: {}
          nullable: true
          description: Cross-validated lambda choice, or null when lambda was fixed.
            Carries cv_rmse, baseline_rmse, folds and n.
        input_digest:
          type: string
          description: Digest of the exact inputs. Comparing it with the digest a
            later publish reports is how an organizer knows the data has not moved.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ResultRow'
        uncertainty:
          $ref: '#/components/schemas/RankUncertainty'
        live_pairwise:
          type: object
          additionalProperties: {}
          description: Pairwise component counts and whether live ballots were used.
        judge_rows:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Per-judge offset and load; organizer only.
        awards:
          type: array
          items:
            $ref: '#/components/schemas/Award'
        unawarded:
          type: array
          items:
            $ref: '#/components/schemas/UnawardedPrize'
        diagnostics:
          type: object
          additionalProperties: {}
          description: under_reviewed, single_review_judges, constant_scorers, n_components.
        outliers:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Flagged reviews. Flagged, never auto-excluded.
        spread:
          type: object
          additionalProperties: {}
          description: Score spread before and after normalization.
        n_included:
          type: integer
        n_excluded:
          type: integer
        params:
          type: object
          additionalProperties: {}
          description: Every method parameter, for the record.
      required:
      - awards
      - diagnostics
      - input_digest
      - judge_rows
      - lam
      - lambda_choice
      - live_pairwise
      - method
      - n_excluded
      - n_included
      - outliers
      - params
      - rows
      - spread
      - unawarded
      - uncertainty
    Review:
      type: object
      properties:
        review_id:
          type: string
        event:
          type: string
        project:
          $ref: '#/components/schemas/ProjectRef'
        status:
          type: string
        criteria:
          type: object
          additionalProperties:
            type: integer
        weighted_score:
          type: number
          format: double
        comment:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
      required:
      - comment
      - criteria
      - event
      - project
      - review_id
      - status
      - submitted_at
      - weighted_score
    ReviewDetail:
      type: object
      description: One review. Null fields mean the judge has not started it yet.
      properties:
        review_id:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          description: null, 'draft' or 'submitted'.
        criteria:
          type: object
          additionalProperties:
            type: integer
        comment:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        rubric_version:
          type: integer
          nullable: true
        project_revision:
          type: integer
          nullable: true
      required:
      - comment
      - criteria
      - project_revision
      - review_id
      - rubric_version
      - status
      - submitted_at
    ReviewExclusion:
      type: object
      properties:
        review:
          type: string
          description: Public id of the excluded review.
        reason:
          type: string
          description: Recorded reason; the review is not deleted.
      required:
      - reason
      - review
    ReviewWrite:
      type: object
      properties:
        scores:
          type: object
          additionalProperties:
            type: integer
          description: Criterion key to score, inside that criterion's own min and
            max.
        comment:
          type: string
          maxLength: 4000
    Role:
      type: object
      description: An event role. ``user`` is a display name, never an email address.
      properties:
        public_id:
          type: string
        user:
          type: string
        role:
          type: string
          description: participant, judge, organizer, host or admin.
      required:
      - public_id
      - role
      - user
    RoleEnum:
      enum:
      - organizer
      - judge
      - participant
      type: string
      description: |-
        * `organizer` - organizer
        * `judge` - judge
        * `participant` - participant
    Rubric:
      type: object
      description: The active rubric. ``version`` increments on every replacement.
      properties:
        version:
          type: integer
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/Criterion'
      required:
      - criteria
      - version
    RubricWrite:
      type: object
      properties:
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/CriterionWrite'
      required:
      - criteria
    ScopeEnum:
      enum:
      - overall
      - track
      type: string
      description: |-
        * `overall` - Overall (any track)
        * `track` - Track
    SignedRecord:
      type: object
      description: 'One half of a verifiable record: the claims, and the signature
        over them.'
      properties:
        record:
          type: object
          additionalProperties: {}
          description: kid, record_id, event and judge sub-objects, and issued_at.
        signature:
          type: string
          description: Base64 Ed25519 signature over the record.
      required:
      - record
      - signature
    StatusEnum:
      enum:
      - draft
      - submitted
      - withdrawn
      - disqualified
      - superseded
      type: string
      description: |-
        * `draft` - Draft
        * `submitted` - Submitted
        * `withdrawn` - Withdrawn
        * `disqualified` - Disqualified
        * `superseded` - Superseded
    StyleEnum:
      enum:
      - single
      - quadratic
      type: string
      description: |-
        * `single` - single
        * `quadratic` - quadratic
    Tally:
      type: object
      description: One aggregate row. The underscored names are the tally keys the
        API returns.
      properties:
        project__public_id:
          type: string
        project__title:
          type: string
        votes:
          type: integer
        credits:
          type: integer
          description: Sum of votes squared, the quadratic cost actually spent.
      required:
      - credits
      - project__public_id
      - project__title
      - votes
    Team:
      type: object
      properties:
        public_id:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 120
        event:
          type: string
          readOnly: true
        members:
          type: array
          items: {}
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        max_team_size:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event
      - max_team_size
      - member_count
      - members
      - name
    TeamCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
      required:
      - name
    TeamInvite:
      type: object
      description: Response of a freshly minted invite link; the plaintext is shown
        once.
      properties:
        team:
          type: string
          description: Team public id the link points at.
        url:
          type: string
          description: Full invite link, including the one-time token.
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - team
      - url
    TeamLeave:
      type: object
      properties:
        left:
          type: string
          description: Public id of the team the caller left.
      required:
      - left
    TeamMemberRemoved:
      type: object
      properties:
        removed:
          type: string
          description: Public id of the account removed from the team.
      required:
      - removed
    TeamRef:
      type: object
      properties:
        public_id:
          type: string
        name:
          type: string
      required:
      - name
      - public_id
    Token:
      type: object
      description: A token row. The secret is never part of it, only the lookup prefix.
      properties:
        prefix:
          type: string
          description: 12-character public prefix; what DELETE takes.
        name:
          type: string
        is_demo:
          type: boolean
          description: True for the shared seeded demo token.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - is_demo
      - last_used_at
      - name
      - prefix
      - revoked_at
    TokenCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
      required:
      - name
    TokenCreated:
      type: object
      description: The one and only time the plaintext token exists in a response.
      properties:
        token:
          $ref: '#/components/schemas/Token'
        plaintext:
          type: string
          description: 'Send as ''Authorization: Bearer <plaintext>''.'
      required:
      - plaintext
      - token
    TokenList:
      type: object
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/Token'
      required:
      - tokens
    TokenRow:
      type: object
      properties:
        token:
          $ref: '#/components/schemas/Token'
      required:
      - token
    TourResetOutput:
      type: object
      properties:
        slug:
          type: string
        url:
          type: string
      required:
      - slug
      - url
    TourRoleInput:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
    TourRoleOutput:
      type: object
      properties:
        role:
          type: string
        redirect:
          type: string
      required:
      - redirect
      - role
    TourStartOutput:
      type: object
      properties:
        slug:
          type: string
        url:
          type: string
        steps:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - slug
      - steps
      - url
    TourStepInput:
      type: object
      properties:
        step:
          type: integer
          maximum: 9
          minimum: 0
      required:
      - step
    TourStepOutput:
      type: object
      properties:
        step:
          type: integer
      required:
      - step
    Track:
      type: object
      properties:
        public_id:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 120
        description:
          type: string
        position:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - name
    TrackRef:
      type: object
      properties:
        public_id:
          type: string
        name:
          type: string
      required:
      - name
      - public_id
    TrackWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
        position:
          type: integer
          minimum: 0
      required:
      - name
    UnawardedPrize:
      type: object
      description: A prize that could not be awarded, and why. Shown rather than omitted.
      properties:
        prize_id:
          type: string
        prize:
          type: string
        reason:
          type: string
        place:
          type: integer
          nullable: true
        projects:
          type: array
          items:
            type: string
      required:
      - place
      - prize
      - prize_id
      - projects
      - reason
    UnchangedVerdict:
      type: object
      properties:
        verdict:
          type: string
        matches:
          type: boolean
        differences:
          type: array
          items:
            type: string
      required:
      - differences
      - matches
      - verdict
    UserBrief:
      type: object
      description: A user as anyone but themselves may see them. Never carries an
        email.
      properties:
        public_id:
          type: string
        display_name:
          type: string
          nullable: true
        is_admin:
          type: boolean
        is_host:
          type: boolean
        is_active:
          type: boolean
        date_joined:
          type: string
          format: date-time
          nullable: true
      required:
      - date_joined
      - display_name
      - is_active
      - is_admin
      - is_host
      - public_id
    UserSelf:
      type: object
      description: 'A user as they may see themselves: adds their own email address.'
      properties:
        public_id:
          type: string
        display_name:
          type: string
          nullable: true
        is_admin:
          type: boolean
        is_host:
          type: boolean
        is_active:
          type: boolean
        date_joined:
          type: string
          format: date-time
          nullable: true
        email:
          type: string
          format: email
          description: Only ever returned for the caller's own account.
      required:
      - date_joined
      - display_name
      - email
      - is_active
      - is_admin
      - is_host
      - public_id
    VotingAuditRow:
      type: object
      properties:
        action:
          type: string
        target:
          type: string
          nullable: true
        actor:
          type: string
        summary:
          type: string
        data:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
      required:
      - action
      - actor
      - created_at
      - data
      - summary
      - target
    VotingConfigRead:
      type: object
      description: The current voting configuration and its window, as read back.
      properties:
        configured:
          type: boolean
        access:
          type: string
          description: Present once configured.
        style:
          type: string
        credits:
          type: integer
        max_votes_per_project:
          type: integer
        link_token:
          type: string
          description: Organizer capability that opens open-link voting. Treat it
            as a secret; it is never returned to a non-organizer.
        voting_open_at:
          type: string
          format: date-time
          nullable: true
        voting_close_at:
          type: string
          format: date-time
          nullable: true
      required:
      - configured
    VotingManagement:
      type: object
      description: Organizer view of the ballot table, the abuse flags and the voting
        audit.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Tally'
        ballots:
          type: array
          items:
            $ref: '#/components/schemas/ManagedBallot'
        flags:
          type: array
          items:
            $ref: '#/components/schemas/AbuseFlag'
        audit:
          type: array
          items:
            $ref: '#/components/schemas/VotingAuditRow'
      required:
      - audit
      - ballots
      - flags
      - results
    VotingResults:
      type: object
      properties:
        event:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/Tally'
      required:
      - event
      - results
    WebhookDeliveryAck:
      type: object
      properties:
        delivery_id:
          type: string
          description: Public id of the queued delivery.
        status:
          type: string
          description: '''pending'' now. Delivery happens on a worker with retries,
            leasing and duplicate suppression; 202 means accepted, not delivered.'
      required:
      - delivery_id
      - status
    WebhookEndpoint:
      type: object
      description: A subscriber. The signing secret is never returned by the list
        or the delete.
      properties:
        public_id:
          type: string
        url:
          type: string
          description: Absolute https URL the deliveries are posted to.
        event_types:
          type: array
          items:
            type: string
          description: Subscribed action names, or ['*'] for everything emitted.
        is_active:
          type: boolean
      required:
      - event_types
      - is_active
      - public_id
      - url
    WebhookEndpointCreate:
      type: object
      properties:
        url:
          type: string
          description: Absolute https URL. Plain http, loopback, link-local and private
            ranges are refused as unsafe_webhook_url.
        event_types:
          type: array
          items:
            type: string
          description: Action names to subscribe to. Defaults to every emitted event.
      required:
      - url
    WebhookEndpointCreated:
      type: object
      description: The only time the signing secret is returned; store it now or not
        at all.
      properties:
        public_id:
          type: string
        url:
          type: string
        event_types:
          type: array
          items:
            type: string
        secret:
          type: string
          description: HMAC signing secret. Shown once; deliveries carry 'X-Verdict-Signature'
            derived from it.
      required:
      - event_types
      - public_id
      - secret
      - url
    WebhookEndpointDisabled:
      type: object
      properties:
        public_id:
          type: string
        is_active:
          type: boolean
          description: 'Always false: an endpoint is disabled, never deleted, so its
            delivery history stays auditable.'
      required:
      - is_active
      - public_id
    WebhookEndpointList:
      type: object
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
      required:
      - endpoints
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token from POST /api/v1/me/tokens. No CSRF needed.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
tags:
- name: accounts
  description: Sessions, accounts and API tokens.
- name: events
  description: Events, tracks, prizes, questions and roles.
- name: teams
  description: Teams, membership and invite links.
- name: projects
  description: Submissions, revisions, images and answers.
- name: judging
  description: Rubric, judges, assignments, reviews and scores.
- name: results
  description: Publication, verification and released feedback.
- name: Community voting
  description: Ballots, comments and moderation.
- name: audit
  description: Organizer-only read access to the audit chain.
- name: interop
  description: Exports, imports, webhooks and signed records.
- name: Outbox
  description: Private offline messages queued for organizers.
- name: core
  description: Integrity probe and platform utilities.
- name: Decision Room
  description: Organizer publication readiness and next steps.
