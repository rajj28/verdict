openapi: 3.0.3
info:
  title: VERDICT API
  version: 1.0.0
  description: Hackathon submission and judging portal. All writes go through this
    API.
paths:
  /api/v1/admin/audit/{chain_id}/checkpoint:
    get:
      operationId: admin_audit_chain_checkpoint
      description: Platform administrator only.
      summary: Download one archived audit chain by its public id (admin).
      parameters:
      - in: path
        name: chain_id
        schema:
          type: string
        description: Archived chain public id.
        required: true
      tags:
      - audit
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCheckpointDocument'
          description: Checkpoint document, as a file download.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
  /api/v1/admin/audit/{chain_id}/verify:
    get:
      operationId: admin_audit_chain_verify
      description: Platform administrator only.
      summary: Re-hash one archived audit chain by its public id (admin).
      parameters:
      - in: path
        name: chain_id
        schema:
          type: string
        description: Archived chain public id.
        required: true
      tags:
      - audit
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerify'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
  /api/v1/admin/audit/checkpoint:
    get:
      operationId: admin_audit_checkpoint
      description: Platform administrator only.
      summary: Download the platform-wide audit checkpoint (admin).
      tags:
      - audit
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCheckpointDocument'
          description: Checkpoint document, as a file download.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
  /api/v1/admin/audit/verify:
    get:
      operationId: admin_audit_verify
      description: Platform administrator only.
      summary: Re-hash the platform-wide audit chain (admin).
      tags:
      - audit
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerify'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
  /api/v1/admin/outbox:
    get:
      operationId: admin_outbox_list
      description: Includes event messages and unscoped messages; paginated with a
        maximum page size of 100.
      summary: Read the platform's private offline outbox (admins only).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Outbox
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOutboxMessageList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
  /api/v1/admin/users:
    get:
      operationId: admin_users
      description: GET /api/v1/admin/users.
      summary: Every account (admin only).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - accounts
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
  /api/v1/admin/users/{public_id}:
    patch:
      operationId: admin_user_patch
      description: 'An admin cannot remove their own administrator flag: 409 cannot_demote_self.
        Every change is audited.'
      summary: Toggle is_host, is_admin or is_active on an account.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserPatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserPatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserPatch'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Rejected: malformed body, a field that failed validation,
            or a rule that returns 400. See error.code.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Conflict: the object moved on (a closed window, a duplicate,
            a stale edit).'
  /api/v1/admin/users/{public_id}/reset-link:
    post:
      operationId: user_reset_link
      description: 'Offline portal, no email: the link is returned to the admin to
        hand over. Valid 24 hours, single use, stored hashed, and issuing a new link
        retires any outstanding one.'
      summary: Generate a one-time password reset link.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      tags:
      - accounts
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetLink'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
  /api/v1/auth/demo-login:
    post:
      operationId: demo_login
      description: 'Answers 404 when DEMO_MODE is off: the shortcut is not part of
        a production portal at all, not merely disabled.'
      summary: Sign in as one of the seeded demo accounts.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DemoLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DemoLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Rejected: malformed body, a field that failed validation,
            or a rule that returns 400. See error.code.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
  /api/v1/auth/login:
    post:
      operationId: login
      description: A wrong email and a wrong password give the same message, so the
        endpoint cannot be used to find out which addresses exist. Rate limited to
        10 attempts per 15 minutes per IP and email.
      summary: Sign in with email and password and start a session.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Rejected: malformed body, a field that failed validation,
            or a rule that returns 400. See error.code.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limited. Retry after the window named in the Retry-After
            header.
  /api/v1/auth/logout:
    post:
      operationId: logout
      description: POST /api/v1/auth/logout.
      summary: End the current session.
      tags:
      - accounts
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkRedirect'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
  /api/v1/auth/register:
    post:
      operationId: register
      description: Email is unique and the password must be at least 8 characters
        and pass Django's password checks. Field errors come back under error.fields
        so the form can paint them inline.
      summary: Create an account and sign in.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Rejected: malformed body, a field that failed validation,
            or a rule that returns 400. See error.code.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
  /api/v1/auth/reset-password:
    post:
      operationId: reset_password
      description: Single use and 24 hours. Used, expired and unknown tokens are all
        refused, and the password itself still has to pass the same checks as registration.
      summary: Set a new password with a reset link token.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Rejected: malformed body, a field that failed validation,
            or a rule that returns 400. See error.code.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
  /api/v1/events:
    get:
      operationId: events
      description: Public. A closed or not-yet-open event is still listed, so it is
        not a 404 for a reader.
      summary: List every event with its current phase.
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limited. Retry after the window named in the Retry-After
            header.
    post:
      operationId: event_create
      description: 'Windows are half-open: a submission is accepted at submissions_open_at
        and refused at submissions_close_at.'
      summary: Create an event; the caller becomes its first organizer.
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventWrite'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Rejected: malformed body, a field that failed validation,
            or a rule that returns 400. See error.code.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
  /api/v1/events/{slug}:
    get:
      operationId: event_detail
      summary: Read one event, including whether its submission window is open now.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: Event slug.
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
    patch:
      operationId: event_update
      description: Organizer only. A moved window is re-checked under lock, so a patch
        that crosses the close instant is a 409, not a silent change.
      summary: Change an event's settings, submission window or judging window.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: Event slug.
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventPatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventPatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventPatch'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Rejected: malformed body, a field that failed validation,
            or a rule that returns 400. See error.code.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Conflict: the object moved on (a closed window, a duplicate,
            a stale edit).'
  /api/v1/events/{slug}/assignments:
    get:
      operationId: event_assignments
      description: An organizer sees every assignment; a judge sees their own rows
        only.
      summary: Read the assignment table of an event.
      parameters:
      - in: query
        name: judge
        schema:
          type: string
        description: Filter to one judge public id, where permitted.
      - in: path
        name: slug
        schema:
          type: string
        description: Event slug.
        required: true
      tags:
      - judging
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
    post:
      operationId: event_assignments_create
      description: Manager only. Every pair is re-checked under lock against track,
        conflict and duplicate rules; a refused pair comes back in skipped with the
        reason and does not stop the rest of the batch.
      summary: Create assignments for explicit judge/project pairs.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: Event slug.
        required: true
      tags:
      - judging
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentBatchWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignmentBatchWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignmentBatchWrite'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentBatchResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Rejected: malformed body, a field that failed validation,
            or a rule that returns 400. See error.code.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
  /api/v1/events/{slug}/assignments/{assignment_id}:
    delete:
      operationId: event_assignment_delete
      description: Manager only. A submitted review for the assignment is kept and
        stays attributable; deleting the assignment does not erase the judgment.
      summary: Delete one assignment.
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
        description: Assignment public id.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        description: Event slug.
        required: true
      tags:
      - judging
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Not authenticated: no session cookie and no usable Authorization:
            Bearer token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
  /api/v1/events/{slug}/assignments/auto:
    post:
      operationId: event_assignments_auto
      description: Manager only. dry_run defaults to true, so the default call changes
