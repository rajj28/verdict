          type: string
          nullable: true
        reproducible_verdict:
          type: string
          description: Echo of reproducible.verdict.
        reproducible_detail:
          type: string
        unchanged_verdict:
          type: string
          description: Echo of unchanged_since_publication.verdict.
        difference_text:
          type: string
          description: Field-level differences, as text.
      required:
      - awards_match
      - detail
      - difference_text
      - digest_match
      - live_digest
      - pub_id
      - reproducible
      - reproducible_detail
      - reproducible_verdict
      - rows_match
