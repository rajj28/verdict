                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unsupported media type; JSON is expected except on upload endpoints.
  /api/v1/tour/reset:
    post:
      operationId: tour_reset
      summary: Delete and recreate the current private tour sandbox.
      tags:
      - Tour
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourResetOutput'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limited. Retry after the window named in the Retry-After
            header.
  /api/v1/tour/role:
    post:
      operationId: tour_switch_role
      summary: Switch to a designated role in the current tour sandbox.
      tags:
      - Tour
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourRoleInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TourRoleInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TourRoleInput'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourRoleOutput'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Rejected: malformed body, a field that failed validation,
            or a rule that returns 400. See error.code.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
  /api/v1/tour/start:
    post:
      operationId: tour_start
      summary: Start or resume a private tour sandbox.
      tags:
      - Tour
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourStartOutput'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limited. Retry after the window named in the Retry-After
            header.
  /api/v1/tour/step:
    post:
      operationId: tour_step
      summary: Record the current step in the tour walkthrough.
      tags:
      - Tour
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourStepInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TourStepInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TourStepInput'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourStepOutput'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Rejected: malformed body, a field that failed validation,
            or a rule that returns 400. See error.code.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not allowed. The rule that refused is named
            in error.code.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No such object, or it exists but the caller may not know it
            exists.
components:
  schemas:
    AbuseFlag:
      type: object
      properties:
        public_id:
          type: string
        kind:
          type: string
        subject:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - detail
      - kind
      - public_id
      - resolved_at
      - subject
    AccessEnum:
      enum:
      - open_link
      - email
      - authenticated
      type: string
      description: |-
        * `open_link` - Open link
        * `email` - Email verification
        * `authenticated` - Authenticated account
    ActionEnum:
      enum:
      - publish
      - disqualify
      - exclude_review
      - include_review
      type: string
      description: |-
        * `publish` - publish
        * `disqualify` - disqualify
        * `exclude_review` - exclude_review
        * `include_review` - include_review
    AdminUser:
      type: object
      description: Admin view of an account; adds the email the admin manages.
      properties:
        public_id:
          type: string
        display_name:
          type: string
          nullable: true
        is_admin:
          type: boolean
        is_host:
          type: boolean
        is_active:
          type: boolean
        date_joined:
          type: string
          format: date-time
          nullable: true
        email:
          type: string
          format: email
      required:
      - date_joined
      - display_name
      - email
      - is_active
      - is_admin
      - is_host
      - public_id
    Assignment:
      type: object
      properties:
        public_id:
          type: string
        event:
          type: string
        judge:
          type: string
        project:
          $ref: '#/components/schemas/JudgeProject'
        review_status:
          type: string
          nullable: true
      required:
      - event
      - judge
      - project
      - public_id
      - review_status
    AssignmentBatchResult:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentCreated'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentSkipped'
      required:
      - created
      - skipped
    AssignmentBatchWrite:
      type: object
      properties:
        judges:
          type: array
          items:
            type: string
        projects:
          type: array
          items:
            type: string
      required:
      - judges
      - projects
    AssignmentCreated:
      type: object
      properties:
        public_id:
          type: string
        judge:
          type: string
        project:
          type: string
      required:
      - judge
      - project
      - public_id
    AssignmentList:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
      required:
      - assignments
    AssignmentSkipped:
      type: object
      properties:
        judge:
          type: string
        project:
          type: string
        reason:
          type: string
          description: The eligibility rule that refused this pair.
      required:
      - judge
      - project
      - reason
    AuditCheckpoint:
      type: object
      description: The independently retainable head a verifier can check against
        later.
      properties:
        version:
          type: integer
          description: Hash format version.
        chain_id:
          type: string
          nullable: true
        scope:
          type: string
          description: '''global'' or ''event''.'
        event_slug_at_creation:
          type: string
        sequence:
          type: integer
        head_hash:
          type: string
        legacy_entries:
          type: integer
      required:
      - chain_id
      - event_slug_at_creation
      - head_hash
      - legacy_entries
      - scope
      - sequence
      - version
    AuditCheckpointDocument:
      type: object
      description: 'The bounded download: a verification result plus the canonical
        entries.'
      properties:
        ok:
          type: boolean
          description: False if any consistency error was found.
        chain_id:
          type: string
          nullable: true
        sequence:
          type: integer
          description: Length the stored head claims.
        head_hash:
          type: string
        checked:
          type: integer
          description: Entries actually rehashed and compared.
        errors:
          type: array
          items:
            type: string
        checkpoint:
          $ref: '#/components/schemas/AuditCheckpoint'
        retained_head_present:
          type: boolean
        limitation:
          type: string
          description: What this check does not prove.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditCheckpointEntry'
        entries_included:
          type: boolean
          description: False when the chain is longer than the export bound; the download
            then carries the checkpoint only and note explains why.
        note:
          type: string
      required:
      - chain_id
      - checked
      - checkpoint
      - entries
      - entries_included
      - errors
      - head_hash
      - limitation
      - ok
      - retained_head_present
      - sequence
    AuditCheckpointEntry:
      type: object
      properties:
        payload:
          type: object
          additionalProperties: {}
          description: Canonical, versioned entry payload.
        entry_hash:
          type: string
      required:
      - entry_hash
      - payload
    AuditEntry:
      type: object
      description: One hash-chained entry. The integer pk is never exposed.
      properties:
        entry_id:
          type: string
          description: Stable public identity '<chain_id>:<sequence>'.
        chain_id:
          type: string
        created_at:
          type: string
          format: date-time
        actor:
          type: string
          description: Display label captured at write time.
        actor_public_id:
          type: string
          nullable: true
        action:
          type: string
          description: Dotted action name, e.g. 'project.submitted'.
        target_type:
          type: string
          nullable: true
        target_id:
          type: string
          nullable: true
        summary:
          type: string
        data:
          type: object
          additionalProperties: {}
          description: Action-specific structured detail.
        sequence:
          type: integer
        previous_hash:
          type: string
        entry_hash:
          type: string
      required:
      - action
      - actor
      - actor_public_id
      - chain_id
      - created_at
      - data
      - entry_hash
      - entry_id
      - previous_hash
      - sequence
      - summary
      - target_id
      - target_type
    AuditVerify:
      type: object
      description: Result of re-hashing a consistent prefix of the chain.
      properties:
        ok:
          type: boolean
          description: False if any consistency error was found.
        chain_id:
          type: string
          nullable: true
        sequence:
          type: integer
          description: Length the stored head claims.
        head_hash:
          type: string
        checked:
          type: integer
          description: Entries actually rehashed and compared.
        errors:
          type: array
          items:
            type: string
        checkpoint:
          $ref: '#/components/schemas/AuditCheckpoint'
        retained_head_present:
          type: boolean
        limitation:
          type: string
          description: What this check does not prove.
      required:
      - chain_id
      - checked
      - checkpoint
      - errors
      - head_hash
      - limitation
      - ok
      - retained_head_present
      - sequence
    AutoAssignmentProposed:
      type: object
      properties:
        judge:
          type: string
        project:
          type: string
      required:
      - judge
      - project
    AutoAssignmentResult:
      type: object
      properties:
        dry_run:
          type: boolean
          description: True when nothing was written.
        created:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentCreated'
        proposed:
          type: array
          items:
            $ref: '#/components/schemas/AutoAssignmentProposed'
        unfilled:
          type: array
          items:
            $ref: '#/components/schemas/AutoAssignmentUnfilled'
        batch_created:
          type: boolean
      required:
      - batch_created
      - created
      - dry_run
      - proposed
      - unfilled
    AutoAssignmentUnfilled:
      type: object
      properties:
        project:
          type: string
        target:
          type: integer
        assigned:
          type: integer
        reason:
          type: string
          description: Why the planner could not fill this slot. 'unfilled by this
            planner' is a valid, and common, answer.
      required:
      - assigned
      - project
      - reason
      - target
    AutoAssignmentWrite:
      type: object
      properties:
        target:
          type: integer
          minimum: 1
        max_load:
          type: integer
          minimum: 1
          nullable: true
        seed:
          type: string
        dry_run:
          type: boolean
          default: true
    Award:
      type: object
      description: A prize actually awarded, with the place and the reason it was
        allocated there.
      properties:
        prize_id:
          type: string
        prize:
          type: string
        place:
          type: integer
          nullable: true
        project_id:
          type: string
          nullable: true
        project:
          type: string
        team_id:
          type: string
          nullable: true
        team:
          type: string
        track:
          type: string
          nullable: true
        score:
          type: number
          format: double
          nullable: true
        rank:
          type: integer
          nullable: true
        reason:
          type: string
        note:
          type: string
          nullable: true
      required:
      - note
      - place
      - prize
      - prize_id
      - project
      - project_id
      - rank
      - reason
      - score
      - team
      - team_id
      - track
    AwardChange:
      type: object
      properties:
        prize:
          type: string
        prize_name:
          type: string
        before:
          type: array
          items:
            type: object
            additionalProperties: {}
        after:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - after
      - before
      - prize
      - prize_name
    Ballot:
      type: object
      description: A ballot and the rules that govern it, so the page needs no second
        call.
      properties:
        ballot:
          type: string
          description: Ballot public id; the PUT target.
        projects:
          type: array
          items:
            $ref: '#/components/schemas/BallotProject'
        style:
          type: string
          description: '''single'' or ''quadratic''.'
        credits:
          type: integer
          description: Quadratic credit budget for the whole ballot. The cost of one
            vote is votes squared, so total spend is the sum of squares; unspent credits
            are not refunded.
        max_votes_per_project:
          type: integer
          description: 0 means one vote per project in quadratic mode.
      required:
      - ballot
      - credits
      - max_votes_per_project
      - projects
      - style
    BallotCreate:
      type: object
      properties:
        link_token:
          type: string
        email_ticket:
          type: string
    BallotItem:
      type: object
      properties:
        project:
          type: string
          maxLength: 32
        votes:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - project
      - votes
    BallotModerated:
      type: object
      properties:
        public_id:
          type: string
        voided:
          type: boolean
      required:
      - public_id
      - voided
    BallotProject:
      type: object
      description: 'One row of the ballot: the project and the votes placed on it
        so far.'
      properties:
        public_id:
          type: string
        title:
          type: string
        votes:
          type: integer
          description: 0 while the ballot is unsubmitted.
      required:
      - public_id
      - title
      - votes
    BallotWrite:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BallotItem'
        link_token:
          type: string
        email_ticket:
          type: string
      required:
      - items
    CertificateIndexRow:
      type: object
      properties:
        kind:
          type: string
          description: '''participation'', ''judge'' or ''award''.'
        public_id:
          type: string
        label:
          type: string
        subject:
          type: string
        people:
          type: array
          items:
            type: string
        detail:
          type: string
        project:
          type: string
      required:
      - kind
      - label
      - people
      - public_id
      - subject
    ChangePassword:
      type: object
      properties:
        password:
          type: string
          maxLength: 256
        current_password:
          type: string
          maxLength: 256
      required:
      - current_password
      - password
    ChangePasswordResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
    CommandCenter:
      type: object
      properties:
        event:
          type: string
        forecast:
          $ref: '#/components/schemas/Forecast'
        proposal:
          $ref: '#/components/schemas/RebalanceProposal'
      required:
      - event
      - forecast
      - proposal
    Comment:
      type: object
      description: A visible comment. Hidden comments are absent from the list, not
        marked.
      properties:
        public_id:
          type: string
        author:
          type: string
          description: Display name, never an email address.
        body:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - author
      - body
      - created_at
      - public_id
    CommentCreated:
      type: object
      properties:
        public_id:
          type: string
        body:
          type: string
      required:
      - body
      - public_id
    CommentList:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
      required:
      - comments
    CommentModerated:
      type: object
      properties:
        public_id:
          type: string
        hidden:
          type: boolean
      required:
      - hidden
      - public_id
    CommentWrite:
      type: object
      properties:
        body:
          type: string
          maxLength: 1000
      required:
      - body
    Comparison:
      type: object
      properties:
        public_id:
          type: string
        left:
          type: string
        right:
          type: string
        winner:
          type: string
          nullable: true
          description: Null records an abstention.
        created_at:
          type: string
          format: date-time
        retracted_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - left
      - public_id
      - retracted_at
      - right
      - winner
    ComparisonList:
      type: object
      properties:
        comparisons:
          type: array
          items:
            $ref: '#/components/schemas/Comparison'
      required:
      - comparisons
    ComparisonWrite:
      type: object
      properties:
        left:
          type: string
        right:
          type: string
        winner:
          type: string
          nullable: true
      required:
      - left
      - right
    Conflict:
      type: object
      properties:
        judge:
          type: string
        judge_name:
          type: string
        team:
          type: string
        team_name:
          type: string
        reason:
          type: string
        source:
          type: string
          description: '''organizer'' when recorded by staff, ''judge'' when self-declared.'
      required:
      - judge
      - judge_name
      - reason
      - source
      - team
      - team_name
    ConflictCreated:
      type: object
      properties:
        judge:
          type: string
          description: Absent when the judge declared it themself.
        team:
          type: string
        reason:
          type: string
        source:
          type: string
      required:
      - reason
      - source
      - team
    ConflictList:
      type: object
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
      required:
      - conflicts
    ConflictWrite:
      type: object
      properties:
        judge:
          type: string
        team:
          type: string
        reason:
          type: string
          maxLength: 300
      required:
      - team
    ConsequenceRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        target:
          type: string
          nullable: true
      required:
      - action
    ConsequenceResponse:
      type: object
      properties:
        action:
          type: string
        target:
          type: string
          nullable: true
        basis_digest:
          type: string
        rank_changes:
          type: array
          items:
            $ref: '#/components/schemas/RankChange'
        award_changes:
          type: array
          items:
            $ref: '#/components/schemas/AwardChange'
        winner_before:
          type: object
          additionalProperties: {}
          nullable: true
        winner_after:
          type: object
          additionalProperties: {}
          nullable: true
        n_rank_changes:
          type: integer
        n_award_changes:
          type: integer
        sentence:
          type: string
        certainty:
          type: string
        top_tied:
          type: boolean
        top_tie_warning:
          type: string
      required:
      - action
      - award_changes
      - basis_digest
      - certainty
      - n_award_changes
      - n_rank_changes
      - rank_changes
      - sentence
      - target
      - top_tie_warning
      - top_tied
      - winner_after
      - winner_before
    Criterion:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        weight:
          type: string
          description: Decimal as sent, for example '0.400'.
        min_score:
          type: integer
        max_score:
          type: integer
        position:
          type: integer
      required:
      - description
      - key
      - max_score
      - min_score
      - name
      - position
      - weight
    CriterionWrite:
      type: object
      properties:
        key:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        description:
          type: string
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
        min_score:
          type: integer
          maximum: 32767
          minimum: 0
        max_score:
          type: integer
          maximum: 32767
          minimum: 1
        position:
          type: integer
          minimum: 0
      required:
      - key
      - name
      - weight
    DeliveryEnum:
      enum:
      - queued
      - sent
      type: string
      description: |-
        * `queued` - queued
        * `sent` - sent
    DemoLogin:
      type: object
      properties:
        role:
          type: string
          maxLength: 40
      required:
      - role
    Disqualify:
      type: object
      properties:
        reason:
          type: string
          maxLength: 2000
        expected_digest:
          type: string
          maxLength: 64
      required:
      - reason
    EmailDelivery:
      type: object
      properties:
        sent:
          type: boolean
        delivery:
          $ref: '#/components/schemas/DeliveryEnum'
        detail:
          type: string
      required:
      - delivery
      - detail
      - sent
    EmailTicket:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    EmailVerification:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ErrorBody:
      type: object
      description: The ``error`` object every non-2xx response carries.
      properties:
        code:
          type: string
          description: Stable machine code, e.g. 'deadline_closed' or 'not_authenticated'.
        message:
          type: string
          description: Human sentence, safe to show to the caller.
        fields:
          type: object
          additionalProperties: {}
          description: Field name to message list when the failure is per-field; empty
            otherwise.
      required:
      - code
      - fields
      - message
    ErrorEnvelope:
      type: object
      description: The one and only error shape in this API.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    Event:
