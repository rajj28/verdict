          - $ref: '#/components/schemas/ReplayVerdict'
          description: Re-running the engine on the stored input snapshot.
        unchanged_since_publication:
          allOf:
          - $ref: '#/components/schemas/UnchangedVerdict'
          description: Whether the live data still digests to the same value.
